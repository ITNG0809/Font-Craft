<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Font Creator Studio Pro</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- opentype.js for OTF generation -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        .canvas-bg {
            background-color: #0f172a;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- TOP HEADER / NAVBAR -->
    <header class="h-14 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-4 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid font-mono">F</i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-slate-200">Vector Font Studio Pro</h1>
                <p class="text-[10px] text-slate-400">Jōyō Kanji & Symbol Font Generator</p>
            </div>
        </div>

        <!-- Center Actions & Tools -->
        <div class="flex items-center space-x-2">
            <!-- Undo / Redo -->
            <button id="btn-undo" class="px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 text-xs font-medium transition flex items-center gap-1.5" title="元に戻す (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left"></i> 元に戻す
            </button>
            <button id="btn-redo" class="px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 text-xs font-medium transition flex items-center gap-1.5" title="やり直す (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right"></i> やり直す
            </button>

            <div class="h-4 w-px bg-slate-800 mx-1"></div>

            <!-- Project Save / Load -->
            <button id="btn-save-project" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition flex items-center gap-1.5 border border-slate-700" title="プロジェクトをJSON保存">
                <i class="fa-solid fa-floppy-disk text-indigo-400"></i> 保存 (Save)
            </button>
            <button id="btn-load-project" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition flex items-center gap-1.5 border border-slate-700" title="JSONからプロジェクト読み込み">
                <i class="fa-solid fa-folder-open text-amber-400"></i> 開く (Load)
            </button>
            <input type="file" id="input-file-project" accept=".json" class="hidden" />

            <div class="h-4 w-px bg-slate-800 mx-1"></div>

            <!-- Export OTF -->
            <button id="btn-export-otf" class="px-3.5 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-md shadow-indigo-600/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> OTFフォント書き出し
            </button>
        </div>
    </header>

    <!-- MAIN STUDIO WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">

        <!-- LEFT PANEL: Character Grid & Categories -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900 flex flex-col shrink-0">
            <!-- Filter & Search Box -->
            <div class="p-3 border-b border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                    <input type="text" id="glyph-search" placeholder="文字を検索 (例: あ, A, 漢, 記号)..." class="w-full bg-slate-950 border border-slate-800 rounded-md pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <select id="glyph-category" class="w-full bg-slate-950 border border-slate-800 rounded-md px-2 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="all">全文字 (英数・ひらがな・常用漢字2136字)</option>
                    <option value="latin">英数字・基本記号 (Latin / Symbols)</option>
                    <option value="hiragana">ひらがな・濁点・句読点 (Hiragana)</option>
                    <option value="symbols">記号・約物専用 (Symbols)</option>
                    <option value="kanji-g1">常用漢字 小学校1年生 (80字)</option>
                    <option value="kanji-g2">常用漢字 小学校2年生 (160字)</option>
                    <option value="kanji-g3">常用漢字 小学校3年生 (200字)</option>
                    <option value="kanji-g4">常用漢字 小学校4年生 (202字)</option>
                    <option value="kanji-g5">常用漢字 小学校5年生 (193字)</option>
                    <option value="kanji-g6">常用漢字 小学校6年生 (191字)</option>
                    <option value="kanji-s">常用漢字 中学校・一般 (1110字)</option>
                </select>
            </div>

            <!-- Glyph List Summary & Actions -->
            <div class="px-3 py-1.5 bg-slate-950/50 border-b border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                <span id="glyph-count-info">0 文字表示中</span>
                <button id="btn-center-all-symbols" class="text-indigo-400 hover:text-indigo-300 underline font-medium" title="すべての記号・約物の左右を自動中央揃えにします">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 記号を一括中央揃え
                </button>
            </div>

            <!-- Character Grid Scrollable -->
            <div id="glyph-grid" class="flex-1 p-2 grid grid-cols-5 gap-1.5 overflow-y-auto custom-scrollbar content-start">
                <!-- Glyph Items Populated via JS -->
            </div>
        </aside>

        <!-- CENTER PANEL: Canvas Editor & Drawing Area -->
        <main class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
            <!-- Editor Toolbar -->
            <div class="h-11 border-b border-slate-800 bg-slate-900/80 px-4 flex items-center justify-between z-10 shrink-0">
                <div class="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                    <button id="tool-select" class="px-3 py-1 rounded text-xs font-medium flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm transition">
                        <i class="fa-solid fa-arrow-pointer"></i> 選択・編集 (V)
                    </button>
                    <button id="tool-draw" class="px-3 py-1 rounded text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 transition">
                        <i class="fa-solid fa-pen-nib"></i> パス描画 (P)
                    </button>
                </div>

                <!-- Current Character Heading -->
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">編集中の文字:</span>
                    <span id="current-glyph-char" class="text-lg font-bold text-amber-400 font-mono bg-slate-800 px-2.5 py-0.5 rounded border border-slate-700">A</span>
                    <span id="current-glyph-unicode" class="text-xs font-mono text-slate-400">U+0041</span>
                </div>

                <!-- Canvas Helper Toggles -->
                <div class="flex items-center space-x-3 text-xs text-slate-400">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="chk-grid" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0"> Grid
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="chk-guides" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0"> メトリクス線
                    </label>
                    <button id="btn-clear-paths" class="text-rose-400 hover:text-rose-300 ml-2 transition">
                        <i class="fa-solid fa-trash-can"></i> 消去
                    </button>
                </div>
            </div>

            <!-- Vector Canvas Container -->
            <div class="flex-1 relative canvas-bg flex items-center justify-center overflow-hidden">
                <canvas id="vector-canvas" class="cursor-crosshair shadow-2xl rounded border border-slate-800/50"></canvas>
                
                <!-- On-Screen Selection Tooltip / Instructions -->
                <div class="absolute bottom-3 left-4 bg-slate-900/90 backdrop-blur border border-slate-800 text-slate-400 text-[11px] px-3 py-1.5 rounded-md pointer-events-none shadow-lg">
                    [Click] 頂点追加 / 選択 | [Drag] 枠選択 | [Delete] 頂点削除 | [Shift+Click] サブパス切り替え
                </div>
            </div>
        </main>

        <!-- RIGHT PANEL: Metrics, Symbol Center, and Live Font Preview -->
        <aside class="w-80 border-l border-slate-800 bg-slate-900 flex flex-col shrink-0">
            <!-- Tab Navigation Header -->
            <div class="p-3 border-b border-slate-800">
                <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">個別文字 ＆ メトリクス設定</h2>
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-5">
                
                <!-- Individual Glyph Layout Control Section -->
                <div class="bg-slate-950 p-3.5 rounded-lg border border-slate-800 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
                        <span class="text-xs font-bold text-indigo-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-sliders"></i> 個別配置・余白設定
                        </span>
                        <!-- Symbol Auto-Center Button -->
                        <button id="btn-center-glyph" class="px-2 py-1 rounded bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 text-[11px] font-medium transition flex items-center gap-1">
                            <i class="fa-solid fa-align-center"></i> この文字を中央揃え
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1">拡大縮小 (%)</label>
                            <input type="number" id="glyph-scale" value="100" min="10" max="300" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1">上下位置 (Y Offset)</label>
                            <input type="number" id="glyph-v-offset" value="0" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1">左余白 (Left Margin)</label>
                            <input type="number" id="glyph-margin-left" value="50" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1">右余白 (Right Margin)</label>
                            <input type="number" id="glyph-margin-right" value="50" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- Global Font Metrics -->
                <div class="bg-slate-950 p-3.5 rounded-lg border border-slate-800 space-y-3">
                    <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5 border-b border-slate-800/80 pb-2">
                        <i class="fa-solid fa-ruler-combined text-amber-400"></i> 全体メトリクス設定
                    </span>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1">アセンダ (Ascender)</label>
                            <input type="number" id="global-ascender" value="800" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1">ディセンダ (Descender)</label>
                            <input type="number" id="global-descender" value="-200" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- Live Preview Textarea -->
                <div class="bg-slate-950 p-3.5 rounded-lg border border-slate-800 space-y-2">
                    <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-eye text-emerald-400"></i> リアルタイムフォントプレビュー
                    </span>
                    <textarea id="preview-text" rows="3" class="w-full bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none" placeholder="プレビュー用のテキストを入力..."></textarea>
                    <div class="p-3 bg-white text-black rounded min-h-[90px] overflow-x-auto break-words font-mono text-sm border border-slate-300 shadow-inner" id="preview-render-area">
                        <!-- Preview Canvas Rendered Here -->
                    </div>
                </div>

            </div>
        </aside>

    </div>

    <script>
        // --- JŌYŌ KANJI & CHARACTER LISTS ---
        const JOY_KANJI_G1 = "一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小森上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六";
        const JOY_KANJI_G2 = "引羽雲園遠黄何科夏家歌画回会海絵外角楽汽数形京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時7首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台谷知地池茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬買売麦半番父風分文章前後母毎万鳴妹毎名理用矢理曜用理羽";
        const SYMBOLS_LIST = "！" "？" "、" "。" "「" "」" "（" "）" "・" "：" "；" "＋" "−" "＝" "％" "＆" "＄" "＃" "＠" "★" "☆" "♪" "→" "←" "↑" "↓";
        
        // Character coverage builder
        function generateCharacterList() {
            const list = [];
            // Latin Capital
            for (let i = 65; i <= 90; i++) list.push(String.fromCharCode(i));
            // Latin Small
            for (let i = 97; i <= 122; i++) list.push(String.fromCharCode(i));
            // Numbers
            for (let i = 48; i <= 57; i++) list.push(String.fromCharCode(i));
            // Hiragana range
            for (let i = 0x3041; i <= 0x3096; i++) list.push(String.fromCharCode(i));
            // Punctuation & Japanese Symbols
            ["、", "。", "！", "？", "「", "」", "（", "）", "・", "：", "；", "＋", "−", "＝", "％", "＆", "＄", "＃", "＠", "★", "☆", "♪", "→", "←", "↑", "↓"].forEach(c => list.push(c));
            // Jōyō Kanji Grade 1
            for (let ch of JOY_KANJI_G1) if(!list.includes(ch)) list.push(ch);
            return list;
        }

        const ALL_CHARS = generateCharacterList();

        // --- APP STATE & GLYPH STORAGE ---
        const state = {
            currentChar: 'A',
            tool: 'select', // 'select' or 'draw'
            
            // Font Global Settings
            ascender: 800,
            descender: -200,

            // Character Data Store
            // Format: { 'A': { paths: [ [ {x, y}, ... ] ], scale: 100, vOffset: 0, marginLeft: 50, marginRight: 50 } }
            glyphs: {},

            // Canvas & Selection
            selectedNodes: [], // [{pathIdx, nodeIdx}]
            activePathIdx: 0,
            isDragging: false,
            isMarquee: false,
            marqueeStart: { x: 0, y: 0 },
            marqueeEnd: { x: 0, y: 0 },
            dragStartPos: { x: 0, y: 0 },

            // Undo / Redo Stacks
            undoStack: [],
            redoStack: []
        };

        // Initialize Default Glyphs
        ALL_CHARS.forEach(ch => {
            state.glyphs[ch] = {
                paths: [[]],
                scale: 100,
                vOffset: 0,
                marginLeft: SYMBOLS_LIST.includes(ch) ? 80 : 50,
                marginRight: SYMBOLS_LIST.includes(ch) ? 80 : 50
            };
        });

        // Add Default Letter 'A' Sample vector path for immediate testing
        state.glyphs['A'].paths = [
            [{x: 100, y: 0}, {x: 500, y: 800}, {x: 400, y: 800}, {x: 100, y: 200}, {x: -200, y: 800}, {x: -300, y: 800}],
            [{x: -100, y: 400}, {x: 300, y: 400}, {x: 250, y: 500}, {x: -150, y: 500}]
        ];

        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('vector-canvas');
        const ctx = canvas.getContext('2d');
        const glyphGrid = document.getElementById('glyph-grid');
        const previewTextElem = document.getElementById('preview-text');
        const previewRenderArea = document.getElementById('preview-render-area');

        // --- LOCAL STORAGE PERSISTENCE ---
        const STORAGE_KEY = 'VectorFontStudio_Pro_Save';

        function autoSaveToLocalStorage() {
            try {
                const payload = {
                    ascender: state.ascender,
                    descender: state.descender,
                    glyphs: state.glyphs
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {
                console.warn('LocalStorage Save Failed:', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed.ascender) state.ascender = parsed.ascender;
                    if (parsed.descender) state.descender = parsed.descender;
                    if (parsed.glyphs) {
                        Object.keys(parsed.glyphs).forEach(ch => {
                            if (state.glyphs[ch]) {
                                state.glyphs[ch] = parsed.glyphs[ch];
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn('LocalStorage Restore Failed:', e);
            }
        }

        // --- SAVE / LOAD PROJECT (JSON EXPORT & IMPORT) ---
        function exportProjectJSON() {
            const projectData = {
                version: "1.0",
                timestamp: new Date().toISOString(),
                ascender: state.ascender,
                descender: state.descender,
                glyphs: state.glyphs
            };
            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `font-project-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importProjectJSON(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.glyphs) {
                        pushUndoState();
                        state.ascender = parsed.ascender || 800;
                        state.descender = parsed.descender || -200;
                        Object.keys(parsed.glyphs).forEach(ch => {
                            state.glyphs[ch] = parsed.glyphs[ch];
                        });
                        updateUIFromState();
                        drawCanvas();
                        renderPreviewText();
                        autoSaveToLocalStorage();
                        alert("プロジェクトを正常に読み込みました。");
                    }
                } catch (err) {
                    alert("JSONファイルの読み込みに失敗しました。正しいプロジェクトファイルかご確認ください。");
                }
            };
            reader.readAsText(file);
        }

        // --- UNDO / REDO SYSTEM ---
        function pushUndoState() {
            state.undoStack.push(JSON.stringify(state.glyphs));
            state.redoStack = []; // Clear redo
            if (state.undoStack.length > 30) state.undoStack.shift();
            updateUndoRedoButtons();
            autoSaveToLocalStorage();
        }

        function undo() {
            if (state.undoStack.length === 0) return;
            state.redoStack.push(JSON.stringify(state.glyphs));
            const prev = state.undoStack.pop();
            state.glyphs = JSON.parse(prev);
            updateUIFromState();
            drawCanvas();
            renderPreviewText();
            updateUndoRedoButtons();
            autoSaveToLocalStorage();
        }

        function redo() {
            if (state.redoStack.length === 0) return;
            state.undoStack.push(JSON.stringify(state.glyphs));
            const next = state.redoStack.pop();
            state.glyphs = JSON.parse(next);
            updateUIFromState();
            drawCanvas();
            renderPreviewText();
            updateUndoRedoButtons();
            autoSaveToLocalStorage();
        }

        function updateUndoRedoButtons() {
            document.getElementById('btn-undo').disabled = state.undoStack.length === 0;
            document.getElementById('btn-redo').disabled = state.redoStack.length === 0;
        }

        // --- SYMBOL & GLYPH CENTER CALCULATION ---
        function centerGlyphPaths(ch) {
            const g = state.glyphs[ch];
            if (!g || !g.paths || g.paths.length === 0) return;

            // Calculate Bounding Box of vector points
            let minX = Infinity, maxX = -Infinity;
            let count = 0;

            g.paths.forEach(p => {
                p.forEach(pt => {
                    if (pt.x < minX) minX = pt.x;
                    if (pt.x > maxX) maxX = pt.x;
                    count++;
                });
            });

            if (count === 0 || minX === Infinity) return;

            const bboxWidth = maxX - minX;
            const glyphCenterX = (minX + maxX) / 2;

            // Target Center is 500 (standard canvas origin center)
            const offsetX = 500 - glyphCenterX;

            // Offset all points horizontally
            pushUndoState();
            g.paths.forEach(p => {
                p.forEach(pt => {
                    pt.x += offsetX;
                });
            });

            drawCanvas();
            renderPreviewText();
        }

        function centerAllSymbols() {
            pushUndoState();
            SYMBOLS_LIST.split('').forEach(sym => {
                if (state.glyphs[sym]) {
                    centerGlyphPaths(sym);
                }
            });
            drawCanvas();
            renderPreviewText();
            alert("すべての記号・約物パスの中央揃え処理が完了しました。");
        }

        // --- CANVAS RENDER & DRAWING ---
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width - 40;
            canvas.height = rect.height - 40;
            drawCanvas();
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 100;
            const scale = 0.45; // Canvas View Scale

            // Draw Metric Guidelines
            if (document.getElementById('chk-guides').checked) {
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1;

                // Baseline (y = 0)
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvas.width, centerY);
                ctx.strokeStyle = '#6366f1';
                ctx.stroke();

                // Ascender Line
                ctx.beginPath();
                ctx.moveTo(0, centerY - state.ascender * scale);
                ctx.lineTo(canvas.width, centerY - state.ascender * scale);
                ctx.strokeStyle = '#f59e0b';
                ctx.stroke();

                // Descender Line
                ctx.beginPath();
                ctx.moveTo(0, centerY - state.descender * scale);
                ctx.lineTo(canvas.width, centerY - state.descender * scale);
                ctx.strokeStyle = '#ef4444';
                ctx.stroke();

                // Center Origin Line (x = 500)
                ctx.beginPath();
                ctx.moveTo(centerX, 0);
                ctx.lineTo(centerX, canvas.height);
                ctx.strokeStyle = '#475569';
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Current Glyph Data
            const g = state.glyphs[state.currentChar];
            if (!g) return;

            // Render Paths
            g.paths.forEach((path, pIdx) => {
                if (path.length === 0) return;

                ctx.beginPath();
                path.forEach((pt, nIdx) => {
                    const screenX = centerX + (pt.x - 500) * scale;
                    const screenY = centerY - pt.y * scale;
                    if (nIdx === 0) ctx.moveTo(screenX, screenY);
                    else ctx.lineTo(screenX, screenY);
                });
                ctx.closePath();

                // Filled Path Area
                ctx.fillStyle = pIdx === state.activePathIdx ? 'rgba(99, 102, 241, 0.25)' : 'rgba(148, 163, 184, 0.15)';
                ctx.fill();
                ctx.strokeStyle = pIdx === state.activePathIdx ? '#818cf8' : '#64748b';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Render Path Handles & Nodes
                path.forEach((pt, nIdx) => {
                    const screenX = centerX + (pt.x - 500) * scale;
                    const screenY = centerY - pt.y * scale;

                    const isSelected = state.selectedNodes.some(s => s.pathIdx === pIdx && s.nodeIdx === nIdx);

                    ctx.beginPath();
                    ctx.arc(screenX, screenY, isSelected ? 6 : 4, 0, Math.PI * 2);
                    ctx.fillStyle = isSelected ? '#f59e0b' : '#38bdf8';
                    ctx.fill();
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                });
            });

            // Marquee Box
            if (state.isMarquee) {
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.strokeRect(
                    state.marqueeStart.x,
                    state.marqueeStart.y,
                    state.marqueeEnd.x - state.marqueeStart.x,
                    state.marqueeEnd.y - state.marqueeStart.y
                );
                ctx.setLineDash([]);
            }
        }

        // --- CANVAS MOUSE INTERACTIONS ---
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function screenToVectorCoords(pos) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 100;
            const scale = 0.45;
            return {
                x: Math.round((pos.x - centerX) / scale + 500),
                y: Math.round((centerY - pos.y) / scale)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getCanvasPos(e);
            const vec = screenToVectorCoords(pos);
            const g = state.glyphs[state.currentChar];

            if (state.tool === 'draw') {
                pushUndoState();
                if (!g.paths[state.activePathIdx]) g.paths[state.activePathIdx] = [];
                g.paths[state.activePathIdx].push(vec);
                state.selectedNodes = [{ pathIdx: state.activePathIdx, nodeIdx: g.paths[state.activePathIdx].length - 1 }];
                drawCanvas();
                renderPreviewText();
                return;
            }

            // Select Tool Logic
            if (e.shiftKey) {
                // Switch or add Sub-path
                pushUndoState();
                g.paths.push([]);
                state.activePathIdx = g.paths.length - 1;
                return;
            }

            // Node Hit Detection
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 100;
            const scale = 0.45;

            let hit = null;
            g.paths.forEach((path, pIdx) => {
                path.forEach((pt, nIdx) => {
                    const sx = centerX + (pt.x - 500) * scale;
                    const sy = centerY - pt.y * scale;
                    const dist = Math.hypot(sx - pos.x, sy - pos.y);
                    if (dist < 8) {
                        hit = { pathIdx: pIdx, nodeIdx: nIdx };
                    }
                });
            });

            if (hit) {
                state.selectedNodes = [hit];
                state.isDragging = true;
                state.dragStartPos = vec;
                state.activePathIdx = hit.pathIdx;
            } else {
                // Marquee Select Start
                state.isMarquee = true;
                state.marqueeStart = pos;
                state.marqueeEnd = pos;
                state.selectedNodes = [];
            }
            drawCanvas();
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasPos(e);
            const vec = screenToVectorCoords(pos);

            if (state.isDragging && state.selectedNodes.length > 0) {
                const dx = vec.x - state.dragStartPos.x;
                const dy = vec.y - state.dragStartPos.y;

                const g = state.glyphs[state.currentChar];
                state.selectedNodes.forEach(s => {
                    if (g.paths[s.pathIdx] && g.paths[s.pathIdx][s.nodeIdx]) {
                        g.paths[s.pathIdx][s.nodeIdx].x += dx;
                        g.paths[s.pathIdx][s.nodeIdx].y += dy;
                    }
                });

                state.dragStartPos = vec;
                drawCanvas();
                renderPreviewText();
            } else if (state.isMarquee) {
                state.marqueeEnd = pos;
                drawCanvas();
            }
        });

        window.addEventListener('mouseup', () => {
            if (state.isMarquee) {
                // Find all nodes in Marquee
                const minX = Math.min(state.marqueeStart.x, state.marqueeEnd.x);
                const maxX = Math.max(state.marqueeStart.x, state.marqueeEnd.x);
                const minY = Math.min(state.marqueeStart.y, state.marqueeEnd.y);
                const maxY = Math.max(state.marqueeStart.y, state.marqueeEnd.y);

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2 + 100;
                const scale = 0.45;

                const g = state.glyphs[state.currentChar];
                state.selectedNodes = [];

                g.paths.forEach((path, pIdx) => {
                    path.forEach((pt, nIdx) => {
                        const sx = centerX + (pt.x - 500) * scale;
                        const sy = centerY - pt.y * scale;
                        if (sx >= minX && sx <= maxX && sy >= minY && sy <= maxY) {
                            state.selectedNodes.push({ pathIdx: pIdx, nodeIdx: nIdx });
                        }
                    });
                });

                state.isMarquee = false;
                drawCanvas();
            }

            if (state.isDragging) {
                pushUndoState();
                state.isDragging = false;
            }
        });

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (state.selectedNodes.length > 0) {
                    pushUndoState();
                    const g = state.glyphs[state.currentChar];
                    // Delete in reverse order
                    state.selectedNodes.sort((a,b) => b.nodeIdx - a.nodeIdx).forEach(s => {
                        if (g.paths[s.pathIdx]) {
                            g.paths[s.pathIdx].splice(s.nodeIdx, 1);
                        }
                    });
                    state.selectedNodes = [];
                    drawCanvas();
                    renderPreviewText();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            } else if (e.key === 'v' || e.key === 'V') {
                setTool('select');
            } else if (e.key === 'p' || e.key === 'P') {
                setTool('draw');
            }
        });

        // --- UI & GLYPH LIST RENDERING ---
        function renderGlyphGrid() {
            glyphGrid.innerHTML = '';
            const search = document.getElementById('glyph-search').value.toLowerCase();
            const category = document.getElementById('glyph-category').value;

            let filtered = ALL_CHARS.filter(ch => {
                if (search && !ch.toLowerCase().includes(search)) return false;
                if (category === 'latin') return /[A-Za-z0-9]/.test(ch);
                if (category === 'hiragana') return /[\u3040-\u309F]/.test(ch);
                if (category === 'symbols') return SYMBOLS_LIST.includes(ch);
                if (category === 'kanji-g1') return JOY_KANJI_G1.includes(ch);
                return true;
            });

            document.getElementById('glyph-count-info').innerText = `${filtered.length} 文字表示中`;

            filtered.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = `h-10 rounded-md flex flex-col items-center justify-center font-mono transition text-xs border ${
                    ch === state.currentChar
                        ? 'bg-indigo-600 text-white border-indigo-400 font-bold shadow-md'
                        : 'bg-slate-950 text-slate-300 border-slate-800 hover:bg-slate-800 hover:border-slate-700'
                }`;
                btn.innerText = ch;
                btn.onclick = () => selectGlyph(ch);
                glyphGrid.appendChild(btn);
            });
        }

        function selectGlyph(ch) {
            state.currentChar = ch;
            state.selectedNodes = [];
            state.activePathIdx = 0;
            document.getElementById('current-glyph-char').innerText = ch;
            document.getElementById('current-glyph-unicode').innerText = `U+${ch.charCodeAt(0).toString(16).padStart(4, '0').toUpperCase()}`;
            
            updateUIFromState();
            renderGlyphGrid();
            drawCanvas();
        }

        function updateUIFromState() {
            const g = state.glyphs[state.currentChar] || { scale: 100, vOffset: 0, marginLeft: 50, marginRight: 50 };
            document.getElementById('glyph-scale').value = g.scale || 100;
            document.getElementById('glyph-v-offset').value = g.vOffset || 0;
            document.getElementById('glyph-margin-left').value = g.marginLeft || 50;
            document.getElementById('glyph-margin-right').value = g.marginRight || 50;
            document.getElementById('global-ascender').value = state.ascender;
            document.getElementById('global-descender').value = state.descender;
        }

        function setTool(t) {
            state.tool = t;
            document.getElementById('tool-select').className = t === 'select'
                ? 'px-3 py-1 rounded text-xs font-medium flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm transition'
                : 'px-3 py-1 rounded text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 transition';

            document.getElementById('tool-draw').className = t === 'draw'
                ? 'px-3 py-1 rounded text-xs font-medium flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm transition'
                : 'px-3 py-1 rounded text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 transition';
        }

        // --- LIVE PREVIEW RENDERER ---
        function renderPreviewText() {
            previewRenderArea.innerHTML = '';
            const text = previewTextElem.value || "Vector Studio 漢字・記号 AI";

            const pCanvas = document.createElement('canvas');
            pCanvas.height = 70;
            pCanvas.width = Math.max(300, text.length * 50);
            const pCtx = pCanvas.getContext('2d');

            let cursorX = 10;
            const baselineY = 50;
            const scale = 0.04;

            text.split('').forEach(ch => {
                const g = state.glyphs[ch] || state.glyphs['A'];
                if (!g) return;

                const marginLeft = (g.marginLeft !== undefined ? g.marginLeft : 50) * scale;
                const marginRight = (g.marginRight !== undefined ? g.marginRight : 50) * scale;
                const glyphScale = (g.scale !== undefined ? g.scale : 100) / 100;
                const vOffset = (g.vOffset !== undefined ? g.vOffset : 0) * scale;

                cursorX += marginLeft;

                pCtx.beginPath();
                g.paths.forEach(p => {
                    p.forEach((pt, idx) => {
                        const px = cursorX + (pt.x - 500) * scale * glyphScale;
                        const py = baselineY - (pt.y * scale * glyphScale) - vOffset;
                        if (idx === 0) pCtx.moveTo(px, py);
                        else pCtx.lineTo(px, py);
                    });
                });
                pCtx.fillStyle = '#0f172a';
                pCtx.fill();

                cursorX += (400 * scale * glyphScale) + marginRight;
            });

            previewRenderArea.appendChild(pCanvas);
        }

        // --- OPENTYPE.JS FONT EXPORT ---
        function exportOTFFont() {
            try {
                const notdefPath = new opentype.Path();
                notdefPath.moveTo(100, 0);
                notdefPath.lineTo(100, 700);
                notdefPath.lineTo(500, 700);
                notdefPath.lineTo(500, 0);
                notdefPath.closePath();

                const notdefGlyph = new opentype.Glyph({
                    name: '.notdef',
                    unicode: 0,
                    advanceWidth: 600,
                    path: notdefPath
                });

                const fontGlyphs = [notdefGlyph];

                // Export all registered characters
                Object.keys(state.glyphs).forEach(ch => {
                    const gData = state.glyphs[ch];
                    const path = new opentype.Path();

                    const glyphScale = (gData.scale || 100) / 100;
                    const vOffset = gData.vOffset || 0;
                    const marginLeft = gData.marginLeft || 50;
                    const marginRight = gData.marginRight || 50;

                    gData.paths.forEach(p => {
                        if (p.length === 0) return;
                        p.forEach((pt, idx) => {
                            const x = (pt.x - 500) * glyphScale + 500 + marginLeft;
                            const y = pt.y * glyphScale + vOffset;
                            if (idx === 0) path.moveTo(x, y);
                            else path.lineTo(x, y);
                        });
                        path.closePath();
                    });

                    const advanceWidth = 1000 + marginLeft + marginRight;

                    fontGlyphs.push(new opentype.Glyph({
                        name: `char_${ch.charCodeAt(0)}`,
                        unicode: ch.charCodeAt(0),
                        advanceWidth: advanceWidth,
                        path: path
                    }));
                });

                const font = new opentype.Font({
                    familyName: 'VectorStudioCustom',
                    styleName: 'Regular',
                    unitsPerEm: 1000,
                    ascender: parseInt(state.ascender),
                    descender: parseInt(state.descender),
                    glyphs: fontGlyphs
                });

                font.download();
            } catch (err) {
                console.error('OTF Export Error:', err);
                alert('フォント書き出し中にエラーが発生しました。パスの形状をご確認ください。');
            }
        }

        // --- EVENT BINDINGS & INIT ---
        document.getElementById('tool-select').onclick = () => setTool('select');
        document.getElementById('tool-draw').onclick = () => setTool('draw');

        document.getElementById('btn-undo').onclick = undo;
        document.getElementById('btn-redo').onclick = redo;

        document.getElementById('btn-save-project').onclick = exportProjectJSON;
        document.getElementById('btn-load-project').onclick = () => document.getElementById('input-file-project').click();
        document.getElementById('input-file-project').onchange = (e) => {
            if (e.target.files.length > 0) importProjectJSON(e.target.files[0]);
        };

        document.getElementById('btn-center-glyph').onclick = () => centerGlyphPaths(state.currentChar);
        document.getElementById('btn-center-all-symbols').onclick = centerAllSymbols;

        document.getElementById('btn-clear-paths').onclick = () => {
            pushUndoState();
            state.glyphs[state.currentChar].paths = [[]];
            drawCanvas();
            renderPreviewText();
        };

        document.getElementById('btn-export-otf').onclick = exportOTFFont;

        // Metric Control Binding
        ['glyph-scale', 'glyph-v-offset', 'glyph-margin-left', 'glyph-margin-right'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                const g = state.glyphs[state.currentChar];
                if (!g) return;
                if (id === 'glyph-scale') g.scale = parseFloat(e.target.value) || 100;
                if (id === 'glyph-v-offset') g.vOffset = parseFloat(e.target.value) || 0;
                if (id === 'glyph-margin-left') g.marginLeft = parseFloat(e.target.value) || 0;
                if (id === 'glyph-margin-right') g.marginRight = parseFloat(e.target.value) || 0;
                drawCanvas();
                renderPreviewText();
                autoSaveToLocalStorage();
            });
        });

        document.getElementById('global-ascender').addEventListener('input', (e) => {
            state.ascender = parseInt(e.target.value) || 800;
            drawCanvas();
        });
        document.getElementById('global-descender').addEventListener('input', (e) => {
            state.descender = parseInt(e.target.value) || -200;
            drawCanvas();
        });

        document.getElementById('glyph-search').addEventListener('input', renderGlyphGrid);
        document.getElementById('glyph-category').addEventListener('change', renderGlyphGrid);
        previewTextElem.addEventListener('input', renderPreviewText);

        // Window Load Initialization
        window.onload = function() {
            loadFromLocalStorage();
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            renderGlyphGrid();
            selectGlyph('A');
            previewTextElem.value = "Vector Studio 漢字・記号 AI";
            renderPreviewText();
        };
    </script>
</body>
</html>
